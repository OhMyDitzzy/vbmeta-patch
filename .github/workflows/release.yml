name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build (e.g. v1.0.0)"
        required: true
        default: "v0.0.0"

permissions:
  contents: write

env:
  ZIG_VERSION: "0.16.0"

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            target: x86_64-windows
            ext: .exe
          - name: linux-x86_64
            target: x86_64-linux
            ext: ""
          - name: linux-aarch64
            target: aarch64-linux
            ext: ""
          - name: macos-x86_64
            target: x86_64-macos
            ext: ""
          - name: macos-aarch64
            target: aarch64-macos
            ext: ""
          - name: android-aarch64
            target: aarch64-linux-android
            ext: ""
          - name: android-x86_64
            target: x86_64-linux-android
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        id: setup-zig
        uses: mlugg/setup-zig@v2
        continue-on-error: true
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Fallback - install Zig manually
        if: steps.setup-zig.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo "mlugg/setup-zig failed, falling back to a direct download from ziglang.org"
          URL="https://ziglang.org/download/${{ env.ZIG_VERSION }}/zig-x86_64-linux-${{ env.ZIG_VERSION }}.tar.xz"
          curl -fL --retry 5 --retry-delay 5 -o zig.tar.xz "$URL"
          mkdir -p "$HOME/zig-toolchain"
          tar -xJf zig.tar.xz -C "$HOME/zig-toolchain" --strip-components=1
          echo "$HOME/zig-toolchain" >> "$GITHUB_PATH"

      - name: Verify Zig installation
        run: zig version

      - name: Resolve version string
        id: ver
        shell: bash
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          VERSION="${TAG}-${SHORT_SHA}-gh-build"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Build
        run: |
          zig build -Doptimize=ReleaseSafe \
            -Dtarget=${{ matrix.target }} \
            -Dversion="${{ steps.ver.outputs.version }}"

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          BIN="zig-out/bin/vbmeta_patch${{ matrix.ext }}"
          OUT="dist/vbmeta_patch-${{ matrix.name }}${{ matrix.ext }}"
          cp "$BIN" "$OUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vbmeta_patch-${{ matrix.name }}
          path: dist/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version string
        id: ver
        shell: bash
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          VERSION="${TAG}-${SHORT_SHA}-gh-build"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "vbmeta_patch ${{ steps.ver.outputs.tag }}"
          body: |
            **vbmeta_patch ${{ steps.ver.outputs.version }}**

            Developer: Ditzzy

            Prebuilt binaries for Windows, Linux, macOS and Android (arm64/x86_64).
            See README.md for usage instructions.
          files: release/*
          generate_release_notes: true
